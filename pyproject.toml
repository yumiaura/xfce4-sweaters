[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfce4-sweaters"
version = "0.0.0"
description = "Customizable knitted window borders for XFCE4 on X11"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["Pillow>=9", "python-xlib>=0.33"]
readme = "README.md"
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Window Managers :: XFCE",
]

[project.urls]
Homepage = "https://github.com/yumiaura/xfce4-sweaters"

[project.scripts]
xfce4-sweaters = "xfce4_sweaters.__main__:main"

[tool.setuptools.package-data]
xfce4_sweaters = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["xfce4_sweaters*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
