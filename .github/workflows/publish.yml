name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import xfce4_sweaters; print(xfce4_sweaters.__version__)')"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI (trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
